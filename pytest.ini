[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    -s
    --tb=short
    --strict-markers
    --disable-warnings
testpaths = 
    taxbridge/apps/taxonomy/tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
