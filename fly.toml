# fly.toml app configuration file generated for taxbridge on 2026-03-20T21:19:50-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'taxbridge'
primary_region = 'gru'
console_command = 'python manage.py shell'

[build]

[deploy]

[env]
  DJANGO_ENV = 'flyio'
  DJANGO_SETTINGS_MODULE = 'config.settings.flyio'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024