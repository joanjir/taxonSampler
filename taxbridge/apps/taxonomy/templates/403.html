{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 · Type specimen vault</title>
  <link rel="icon" type="image/x-icon" href="{% static 'taxonomy/img/favicon.ico' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background: #f4f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .error-code { font-size: 6rem; font-weight: 800; color: #d63939; line-height: 1; letter-spacing: -2px; }
    @media (max-width: 767px) {
      .error-code { font-size: 4rem; }
    }
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 960px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-lg-5">

      <!-- SVG: holotype specimen behind glass with "DO NOT TOUCH" -->
      <div class="border rounded-3 bg-light mb-4" style="padding: 1.5rem;">
        <svg viewBox="0 0 640 300" role="img" style="width:100%; height:auto; max-height: 260px;">

          <!-- Main trunk -->
          <line x1="100" y1="40" x2="100" y2="260"
                stroke="#6c757d" stroke-width="6" stroke-linecap="round"/>

          <!-- Open branch (accessible) -->
          <line x1="100" y1="90" x2="260" y2="60"
                stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>
          <rect x="260" y="35" width="140" height="50" rx="14"
                fill="#fff" stroke="#212529" stroke-width="4"/>
          <text x="330" y="66" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
                font-size="18" fill="#212529">Clade A</text>

          <!-- Branch to restricted specimen -->
          <line x1="100" y1="190" x2="230" y2="200"
                stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>

          <!-- Glass case (double rectangle) -->
          <rect x="250" y="150" width="210" height="100" rx="10"
                fill="#d63939" fill-opacity="0.06"
                stroke="#d63939" stroke-width="3"/>
          <rect x="258" y="158" width="194" height="84" rx="7"
                fill="#fff" stroke="#d63939" stroke-width="2"
                stroke-dasharray="6 4"/>

          <!-- Specimen label inside case -->
          <text x="355" y="192" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
                font-size="16" fill="#212529" font-style="italic">Holotypus originalis</text>
          <text x="355" y="214" text-anchor="middle"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="12" fill="#d63939" font-weight="700">TYPE SPECIMEN — DO NOT TOUCH</text>

          <!-- Padlock icon on glass case corner -->
          <rect x="438" y="145" width="28" height="22" rx="4"
                fill="#d63939"/>
          <path d="M 445,145 L 445,138 Q 445,130 452,130 Q 459,130 459,138 L 459,145"
                stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="452" cy="154" r="2.5" fill="#fff"/>

          <!-- Red "RESTRICTED" stamp -->
          <text x="490" y="135"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="16" fill="#d63939" font-weight="700"
                transform="rotate(-12, 490, 135)">RESTRICTED</text>

        </svg>
      </div>

      <!-- Text content -->
      <div class="text-center">
        <div class="error-code mb-2">403</div>
        <h1 class="h2 mb-2">Type specimen vault</h1>
        <p class="text-muted fs-4 mb-4">
          This resource is as protected as a holotype in a museum vault.
          Only authorized taxonomists may examine it.
        </p>

        <div class="d-flex flex-wrap gap-3 justify-content-center align-items-center">
          <a href="/taxonomy/" class="btn btn-primary btn-lg px-4">
            <i class="fa-solid fa-house me-2"></i>Back to home
          </a>
          <a href="/accounts/login/" class="btn btn-outline-primary btn-lg px-4">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Log in
          </a>
        </div>

        <div class="text-muted mt-3 fs-5">
          Redirecting in <strong id="countdown">2:00</strong>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var t = 120;
  var el = document.getElementById("countdown");
  var id = setInterval(function () {
    t -= 1;
    if (el) {
      var m = Math.floor(t / 60);
      var s = t % 60;
      el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    }
    if (t <= 0) {
      clearInterval(id);
      window.location.href = "/taxonomy/";
    }
  }, 1000);
})();
</script>

</body>
</html>
