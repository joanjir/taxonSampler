{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Outside evolutionary scope</title>
  <link rel="icon" type="image/x-icon" href="{% static 'taxonomy/img/favicon.ico' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background: #f4f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .error-code { font-size: 6rem; font-weight: 800; color: #206bc4; line-height: 1; letter-spacing: -2px; }
    @media (max-width: 767px) {
      .error-code { font-size: 4rem; }
    }
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 960px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-lg-5">

      <!-- SVG illustration full width on top -->
      <div class="border rounded-3 bg-light mb-4" style="padding: 1.5rem;">
        <svg viewBox="0 0 640 300" role="img" style="width:100%; height:auto; max-height: 260px;">

          <!-- Main trunk -->
          <line x1="120" y1="40" x2="120" y2="260"
                stroke="#6c757d" stroke-width="6" stroke-linecap="round"/>

          <!-- Stable branch -->
          <line x1="120" y1="110" x2="310" y2="75"
                stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>
          <rect x="310" y="50" width="160" height="55" rx="14"
                fill="#ffffff" stroke="#212529" stroke-width="4"/>
          <text x="390" y="84" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
                font-size="20" fill="#212529">Clade A</text>

          <!-- Cut branch -->
          <line x1="120" y1="190" x2="270" y2="210"
                stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>

          <!-- Cut mark (X) -->
          <line x1="252" y1="194" x2="282" y2="224"
                stroke="#dc3545" stroke-width="5" stroke-linecap="round"/>
          <line x1="282" y1="194" x2="252" y2="224"
                stroke="#dc3545" stroke-width="5" stroke-linecap="round"/>

          <!-- Filtered node -->
          <rect x="290" y="186" width="190" height="55" rx="14"
                fill="#ffffff" stroke="#212529" stroke-width="4"
                stroke-dasharray="10 8"/>
          <text x="385" y="220" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
                font-size="20" fill="#212529">Target taxon</text>

          <!-- Red stamp -->
          <text x="300" y="175"
                font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
                font-size="18" fill="#dc3545" font-weight="700">FILTERED</text>

        </svg>
      </div>

      <!-- Text content -->
      <div class="text-center">
        <div class="error-code mb-2">404</div>
        <h1 class="h2 mb-2">Outside evolutionary scope</h1>
        <p class="text-muted fs-4 mb-4">
          This lineage was not retained under the current sampling strategy.
        </p>

        <div class="d-flex flex-wrap gap-3 justify-content-center align-items-center">
          <a href="/taxonomy/" class="btn btn-primary btn-lg px-4">
            <i class="fa-solid fa-house me-2"></i>Back to home
          </a>
        </div>

        <div class="text-muted mt-3 fs-5">
          Redirecting in <strong id="countdown">2:00</strong>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var t = 120;
  var el = document.getElementById("countdown");
  var id = setInterval(function () {
    t -= 1;
    if (el) {
      var m = Math.floor(t / 60);
      var s = t % 60;
      el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    }
    if (t <= 0) {
      clearInterval(id);
      window.location.href = "/taxonomy/";
    }
  }, 1000);
})();
</script>

</body>
</html>
