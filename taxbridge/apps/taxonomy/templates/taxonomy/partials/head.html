<header class="navbar navbar-expand-md d-print-none" data-bs-theme="light">
  <div class="container-xl">
    <!-- Brand -->
    <a class="navbar-brand navbar-brand-autodark me-4" href="{% url 'taxonomy:home' %}"><span class="fw-bold">TaxaBridge</span></a>
    <!-- Mobile toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>

    <div class="collapse navbar-collapse" id="navbar-menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'taxonomy:home' %}"><i class="ti ti-home me-1"></i> Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'taxonomy:tree' %}"><i class="ti ti-binary-tree me-1"></i> Taxonomy Tree</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'taxonomy:taxon-sync-dashboard' %}"><i class="ti ti-arrows-exchange me-1"></i> Taxon Sync</a>
        </li>
      </ul>
      {% if show_tree_controls %}
        <!-- Rank-based navigation -->
        <div class="d-flex align-items-center ms-md-auto mt-2 mt-md-0 me-3" id="rankNavContainer">
          <!-- Rank selector -->
          <select id="rankSelect" class="form-select form-select-sm me-2" style="width: 130px;" autocomplete="off">
            <option value="">Rank...</option>
            <option value="domain">Domain</option>
            <option value="kingdom">Kingdom</option>
            <option value="phylum">Phylum</option>
            <option value="class">Class</option>
            <option value="order">Order</option>
            <option value="family">Family</option>
            <option value="genus">Genus</option>
            <option value="species">Species</option>
          </select>

          <!-- Taxa multi-select (Select2) with "All" option -->
          <select id="taxaSelect" multiple style="width: 250px;" autocomplete="off"></select>

          <!-- Reset button -->
          <button id="rankNavReset" class="btn btn-sm btn-outline-secondary ms-2" title="Reset to Root"><i class="fa-solid fa-rotate-left"></i></button>
        </div>

        <!-- SEARCH -->
        <form class="d-flex mt-2 mt-md-0" role="search" onsubmit="return false;">
          <div class="input-group input-group-sm">
            <!-- Search input -->
            <input id="taxSearch" type="search" class="form-control form-control-sm" placeholder="Search taxon…" aria-label="Search taxon" style="max-width: 150px;" />

            <!-- Prev -->
            <button id="taxSearchPrev" class="btn btn-sm btn-outline-secondary px-2" type="button" title="Previous match" disabled><i class="fa-solid fa-chevron-left fa-xs"></i></button>

            <!-- Next -->
            <button id="taxSearchNext" class="btn btn-sm btn-outline-secondary px-2" type="button" title="Next match" disabled><i class="fa-solid fa-chevron-right fa-xs"></i></button>

            <!-- Hide Existing -->
            <button id="taxSearchHideExisting" class="btn btn-sm btn-outline-secondary px-2" type="button" title="Hide existing species from results"><i class="fa-solid fa-eye-slash fa-xs"></i></button>

            <!-- Clear -->
            <button id="taxSearchClear" class="btn btn-sm btn-outline-secondary px-2" type="button" title="Clear search" disabled><i class="fa-solid fa-xmark fa-xs"></i></button>

            <!-- Search -->
            <button id="taxSearchGo" class="btn btn-sm btn-primary px-2" type="button" title="Search"><i class="fa-solid fa-magnifying-glass fa-xs"></i></button>
          </div>
          <!-- Search status -->
          <div id="searchStatus" class="text-muted small ms-2 align-self-center"></div>
        </form>
      {% endif %}
    </div>
  </div>
</header>
