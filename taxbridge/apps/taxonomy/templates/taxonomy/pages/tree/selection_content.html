<!-- Selection content (dentro de tab) -->
<div class="card-body p-0 border-bottom" style="position:relative; z-index:1050;">
  <div class="d-flex align-items-center justify-content-between px-3 py-2 bg-light">
    <div>
      <span id="selModeBadge" class="badge bg-secondary-lt text-dark me-2">Manual</span>
      <span id="selSubtitle" class="text-muted small">Taxa selected for sampling / export</span>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Selection actions">
      <!-- Import button -->
      <button id="importSelJson" class="btn btn-outline-secondary" type="button" title="Import sampling configuration">
        <i class="fa-solid fa-file-import me-1"></i>
        Import
      </button>
      <input type="file" id="importSelJsonFile" accept=".json,application/json" style="display:none;">
      <!-- Export dropdown -->
      <div class="btn-group btn-group-sm dropdown" role="group">
        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Export">
          <i class="fa-solid fa-file-export me-1"></i>
          Export
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" style="z-index:1060;">
          <li>
            <button id="exportSelJson" class="dropdown-item" type="button"><i class="fa-solid fa-code me-2"></i>JSON</button>
          </li>
          <li>
            <button id="exportSelExcel" class="dropdown-item" type="button"><i class="fa-solid fa-file-excel me-2 text-success"></i>Excel (.xlsx)</button>
          </li>
          <li>
            <button id="exportSelTxt" class="dropdown-item" type="button"><i class="fa-solid fa-file-lines me-2"></i>List (txt)</button>
          </li>
          <li>
            <button id="exportSelNewick" class="dropdown-item" type="button"><i class="fa-solid fa-diagram-project me-2"></i>Newick (species)</button>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li>
            <button id="copySel" class="dropdown-item" type="button"><i class="fa-solid fa-copy me-2"></i>Copy to clipboard</button>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li class="dropdown-header text-muted small">NCBI Download Scripts</li>
          <li>
            <button id="dlScriptGenome" class="dropdown-item" type="button"><i class="fa-solid fa-dna me-2 text-primary"></i>Genomes (FASTA)</button>
          </li>
          <li>
            <button id="dlScriptProtein" class="dropdown-item" type="button"><i class="fa-solid fa-cubes me-2 text-orange"></i>Proteomes (FAA)</button>
          </li>
          <li>
            <button id="dlScriptGbff" class="dropdown-item" type="button"><i class="fa-solid fa-file-medical me-2 text-teal"></i>GenBank (GBFF)</button>
          </li>
          <li>
            <button id="dlScriptAll" class="dropdown-item" type="button"><i class="fa-solid fa-download me-2 text-purple"></i>All data (genome+protein+gbff)</button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Add/Search organisms panel (shown only after DB sampling) -->
<div id="selAddOrgWrap" class="card-body p-0 border-bottom d-none">
  <div class="px-3 py-2">
    <div class="fw-semibold small mb-2">
      <i class="fa-solid fa-search-plus me-1 text-azure"></i>
      Add species from scope
      <span id="selAddOrgCount" class="badge bg-azure-lt text-dark ms-1" style="font-weight:normal;"></span>
      <span class="help-icon text-muted ms-1"
            data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="right"
            data-bs-html="true" data-bs-custom-class="popover-help"
            data-bs-content="<div class='small'>Search and add species from the current sampling scope that were not included in the initial sample.</div>">
        <i class="fa-regular fa-circle-question"></i>
      </span>
    </div>
    <select id="selAddOrgSelect" class="form-select form-select-sm" style="width:100%;">
      <option></option>
    </select>
  </div>
</div>

<!-- Clades breakdown (shown only after DB sampling) -->
<div id="selCladesWrap" class="card-body p-0 border-bottom d-none">
  <div class="px-3 py-2">
    <div class="fw-semibold small mb-1">
      <i class="fa-solid fa-chart-pie me-1 text-primary"></i>
      Clades allocation
      <span class="help-icon text-muted ms-1"
            data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="right"
            data-bs-html="true" data-bs-custom-class="popover-help"
            data-bs-content="&lt;div class='small'&gt;&lt;div class='fw-semibold mb-1'&gt;Clades Allocation&lt;/div&gt;&lt;div&gt;Proportional distribution of species per clade:&lt;/div&gt;&lt;ul class='list-unstyled mb-0 mt-1' style='line-height:1.8'&gt;&lt;li&gt;&lt;span class='badge bg-azure-lt text-dark'&gt;Available&lt;/span&gt; Species with genome in the database&lt;/li&gt;&lt;li&gt;&lt;span class='badge bg-purple-lt text-dark'&gt;Quota&lt;/span&gt; Target assigned by the sampling strategy&lt;/li&gt;&lt;li&gt;&lt;span class='badge bg-green-lt text-dark'&gt;Sampled&lt;/span&gt; Species effectively selected&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;">
        <i class="fa-regular fa-circle-question"></i>
      </span>
      <span id="selCladesHint" class="text-muted ms-2 fw-normal"></span>
    </div>
    <div style="max-height: 180px; overflow-y: auto;">
      <table class="table table-sm table-striped mb-0" style="font-size: .8rem;">
        <thead class="sticky-top bg-white">
          <tr>
            <th style="min-width:120px;">Clade</th>
            <th class="text-end">Available</th>
            <th class="text-end">Quota</th>
            <th class="text-end">Sampled</th>
          </tr>
        </thead>
        <tbody id="selCladesBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Body: selection table -->
<div class="card-body p-0">
  <div class="table-responsive" style="max-height: 600px;">
    <table class="table table-sm table-bordered table-hover align-middle mb-0" style="font-size:.82rem;">
      <thead class="table-light position-sticky" style="top: 0; z-index: 1;">
        <tr>
          <th class="ps-2" style="width:32px;">#</th>
          <th>Clade</th>
          <th>Species</th>
          <th class="text-center" style="min-width:70px;">
            Quality
            <span class="help-icon text-muted ms-1"
                  data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="bottom"
                  data-bs-html="true" data-bs-custom-class="popover-help"
                  data-bs-content="&lt;div class='small'&gt;&lt;div class='fw-semibold mb-1'&gt;Quality Score (Step&amp;nbsp;2)&lt;/div&gt;&lt;div class='mb-1'&gt;Composite score 0 – 1 based on:&lt;/div&gt;&lt;table class='table table-sm mb-0' style='font-size:.78rem;line-height:1.6'&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-green-lt text-dark'&gt;20%&lt;/span&gt; Assembly level&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-azure-lt text-dark'&gt;15%&lt;/span&gt; RefSeq category&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-purple-lt text-dark'&gt;20%&lt;/span&gt; Quality score (NCBI)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-cyan-lt text-dark'&gt;15%&lt;/span&gt; Scaffold N50&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-orange-lt text-dark'&gt;10%&lt;/span&gt; Coverage&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-pink-lt text-dark'&gt;15%&lt;/span&gt; BUSCO complete&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-yellow-lt text-dark'&gt;5%&lt;/span&gt; Gene annotation&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;div class='mt-1 text-muted'&gt;Color: &lt;span class='badge bg-success-lt text-dark'&gt;≥ 0.6&lt;/span&gt; &lt;span class='badge bg-warning-lt text-dark'&gt;≥ 0.3&lt;/span&gt; &lt;span class='badge bg-secondary-lt text-dark'&gt;&amp;lt; 0.3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;">
              <i class="fa-regular fa-circle-question" style="font-weight:normal;"></i>
            </span>
          </th>
          <th class="text-center" style="min-width:70px;">
            Assembly
            <span class="help-icon text-muted ms-1"
                  data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="bottom"
                  data-bs-html="true" data-bs-custom-class="popover-help"
                  data-bs-content="&lt;div class='small'&gt;&lt;div class='fw-semibold mb-1'&gt;Assembly Score (Step&amp;nbsp;3)&lt;/div&gt;&lt;div class='mb-1'&gt;Weighted composite from assembly filter:&lt;/div&gt;&lt;table class='table table-sm mb-0' style='font-size:.78rem;line-height:1.6'&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-cyan-lt text-dark'&gt;35%&lt;/span&gt; Coverage&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-purple-lt text-dark'&gt;30%&lt;/span&gt; Scaffold N50&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class='badge bg-green-lt text-dark'&gt;35%&lt;/span&gt; Quality score&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;div class='mt-1 text-muted'&gt;Color: &lt;span class='badge bg-success-lt text-dark'&gt;≥ 0.6&lt;/span&gt; &lt;span class='badge bg-warning-lt text-dark'&gt;≥ 0.3&lt;/span&gt; &lt;span class='badge bg-danger-lt text-dark'&gt;&amp;lt; 0.3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;">
              <i class="fa-regular fa-circle-question" style="font-weight:normal;"></i>
            </span>
          </th>
          <th class="text-center" style="min-width:80px;">Level</th>
          <th class="text-end pe-2" style="width:48px;">Actions</th>
        </tr>
      </thead>
      <tbody id="selList">
        <tr>
          <td class="text-muted small ps-2" colspan="7">No selection.</td>
        </tr>
      </tbody>
    </table>
    <div id="selHint" class="text-muted small px-3 py-1"></div>
  </div>
</div>

<!-- Footer: metrics + state -->
<div class="card-footer bg-white">
  <div class="row g-2">
    <div class="col-4">
      <div class="border rounded-3 px-2 py-1 d-flex align-items-center justify-content-between">
        <span class="text-muted small"><i class="fa-solid fa-hashtag me-1"></i>Total</span>
        <span id="selCount" class="fw-semibold">0</span>
      </div>
    </div>
    <div class="col-4">
      <div class="border rounded-3 px-2 py-1 d-flex align-items-center justify-content-between">
        <span class="text-muted small"><i class="fa-solid fa-sitemap me-1"></i>Ranks</span>
        <span id="selRanks" class="fw-semibold">–</span>
      </div>
    </div>
    <div class="col-4">
      <div class="border rounded-3 px-2 py-1 d-flex align-items-center justify-content-between">
        <span class="text-muted small"><i class="fa-solid fa-bullseye me-1"></i>Target</span>
        <span id="selTarget" class="fw-semibold">–</span>
      </div>
    </div>
  </div>

  <!-- Status bar (only when sampling result exists) -->
  <div id="samplingStatus" class="mt-2 d-none">
    <div class="d-flex align-items-center justify-content-between">
      <div class="text-muted small">
        <i class="fa-solid fa-seedling me-1"></i>
        Sampling result currently active in the view
      </div>
      <div class="btn-group btn-group-sm">
        <button id="applySamplingView" class="btn btn-outline-success" type="button" title="Apply view (expand to species)"><i class="fa-solid fa-eye me-1"></i>View in taxonomy</button>
        <button id="clearSamplingView" class="btn btn-outline-secondary" type="button" title="Restore full taxonomy"><i class="fa-solid fa-rotate-left me-1"></i>Reset</button>
      </div>
    </div>
  </div>
</div>
