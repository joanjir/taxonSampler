<!-- Tree content (dentro de tab) -->

<div class="card-body p-0 border-bottom">
  <div class="d-flex align-items-center px-3 py-2 bg-light">
    <div class="text-muted small">
      Active path: <span id="crumb" class="text-body">Root</span>
    </div>
  </div>
</div>

<div class="card-body p-0">
  <div id="treeMount" class="position-relative overflow-hidden bg-white" style="height: 540px;">
    <div id="tt" class="position-absolute" style="
            z-index: 20; pointer-events: none;
            background: rgba(17,24,39,.95); color: #fff; font-size: 12px;
            padding: 6px 8px; border-radius: 8px; max-width: 420px;
            white-space: pre-line; box-shadow: 0 8px 24px rgba(0,0,0,.18);
            opacity: 0; transform: translateY(4px);
            transition: opacity 80ms linear, transform 80ms linear;
          "></div>

    <!-- TREE TOOLBAR -->
    <div id="treeToolbar" class="tree-toolbar">
      <button id="zoomInBtn" type="button" class="tree-toolbar-btn" title="Zoom in">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button id="zoomOutBtn" type="button" class="tree-toolbar-btn" title="Zoom out">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <div class="tree-toolbar-sep"></div>
      <button id="fitBtn" type="button" class="tree-toolbar-btn" title="Fit to view">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
      <button id="homeBtn" type="button" class="tree-toolbar-btn" title="Center on root">
        <i class="fa-solid fa-house-chimney"></i>
      </button>
      <button id="collapseAllBtn" type="button" class="tree-toolbar-btn" title="Collapse all">
        <i class="fa-solid fa-folder-minus"></i>
      </button>
      <div class="tree-toolbar-sep"></div>
      <button id="fsBtn" type="button" class="tree-toolbar-btn" title="Fullscreen" aria-label="Fullscreen">
        <i id="fsIcon" class="fa-solid fa-expand"></i>
      </button>
    </div>
  </div>
</div>

<div class="card-footer small text-muted d-flex align-items-center justify-content-between">
  <span>Pan / Zoom: scroll & drag · Click: expand · Double-click species: view details</span>
  <span class="d-flex gap-2 align-items-center">
    <span class="badge" style="background:#d4edda;color:#155724;font-size:10px;">A</span><span>Accepted</span>
    <span class="badge" style="background:#d1ecf1;color:#0c5460;font-size:10px;">S</span><span>Synonym</span>
    <span class="badge" style="background:#f8d7e8;color:#d63384;font-size:10px;">M</span><span>Manual</span>
  </span>
</div>
