{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaxBridge · Explorador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    :root{
      --colw: 260px;
      --colh: 72vh;
    }
    .colnav-wrap{
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 12px;
      align-items: start;
    }
    .columns{
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .tax-col{
      width: var(--colw);
      min-width: var(--colw);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .tax-col-header{
      padding: 10px 10px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      background: rgba(0,0,0,.02);
    }
    .tax-col-body{
      max-height: var(--colh);
      overflow-y: auto;
      padding: 8px;
    }

    /* Items más livianos */
    .node-item{
      display: grid;
      grid-template-columns: 1fr auto auto auto auto; /* + botón ⇢sp */
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.08);
      margin-bottom: 6px;
      background: #fff;
    }
    .node-item:hover{ background: rgba(0,0,0,.02); }
    .node-name{
      font-size: 12.5px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .node-meta{
      font-size: 11px;
      color: rgba(0,0,0,.55);
      margin-top: 2px;
    }
    .badge-count{
      font-size: 11px;
      font-weight: 600;
    }
    .btn-ico{
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1;
    }

    .sidecard{
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .sidecard-header{
      padding: 10px 10px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      background: rgba(0,0,0,.02);
    }
    .sidecard-body{
      padding: 10px;
    }
    .mini{
      font-size: 12px;
      color: rgba(0,0,0,.65);
    }
    .crumb{
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-tight > div{
      padding: 6px 0;
      border-bottom: 1px dashed rgba(0,0,0,.12);
    }
    .list-tight > div:last-child{ border-bottom: 0; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <div class="h4 mb-1">Explorador taxonómico</div>
        <div class="mini">Fuente: ExternalTaxon.classification_path · Solo species accepted</div>
      </div>

      <div class="d-flex gap-2 align-items-end">
        <div>
          <label class="form-label mb-1 small">dataset_code</label>
          <input id="datasetCode" class="form-control form-control-sm mono" style="width: 160px" value="COL25.12">
        </div>
        <div>
          <label class="form-label mb-1 small">Page size</label>
          <select id="pageSize" class="form-select form-select-sm" style="width: 120px">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="500">500</option>
          </select>
        </div>
        <button id="btnStart" class="btn btn-sm btn-primary">Cargar</button>
      </div>
    </div>

    <div class="colnav-wrap">
      <!-- COLUMNS -->
      <div>
        <div class="columns" id="columns"></div>
        <div class="mini mt-2" id="statusLine"></div>
      </div>

      <!-- SIDE PANEL -->
      <div class="d-grid gap-2">
        <div class="sidecard">
          <div class="sidecard-header d-flex align-items-center justify-content-between">
            <div class="fw-semibold">Ramas fijadas</div>
            <button id="btnClearPins" class="btn btn-sm btn-outline-secondary">Limpiar</button>
          </div>
          <div class="sidecard-body">
            <div id="pins" class="list-tight mini">
              <div class="text-muted">Sin pines.</div>
            </div>
          </div>
        </div>

        <div class="sidecard">
          <div class="sidecard-header d-flex align-items-center justify-content-between">
            <div class="fw-semibold">Selección</div>
            <button id="btnClearSel" class="btn btn-sm btn-outline-secondary">Limpiar</button>
          </div>
          <div class="sidecard-body">
            <div class="d-flex gap-2 mb-2">
              <button id="btnResolve" class="btn btn-sm btn-success flex-grow-1">Resolver a especies</button>
            </div>
            <div class="mini mb-2" id="selCount">0 seleccionadas</div>
            <div id="selection" class="list-tight mini">
              <div class="text-muted">Sin selección.</div>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /wrap -->
  </div>

<!-- Bootstrap JS (tooltips) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // =============================
  // AJUSTES acordados:
  //  1) Pines compactos
  //  2) Máximo de columnas visibles (ventana deslizante)
  //  3) Items menos “card”
  //  4) Botón ⇢sp para saltar directo a species + tooltip con origen
  // =============================

  const MAX_COLS = 4; // pon 3 si quieres aún más compacto

  const $ = (id) => document.getElementById(id);

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function pathKey(pathArr){
    return JSON.stringify(pathArr || []);
  }
  function crumb(pathArr){
    if (!pathArr || !pathArr.length) return "ROOT";
    return pathArr.map(x => `${x.rank}:${x.name}`).join(" / ");
  }

  const state = {
    dataset: "COL25.12",
    pageSize: 200,
    pins: new Map(),
    selected: new Map(),
    columns: [],
  };

  function enforceMaxCols(){
    while (state.columns.length > MAX_COLS){
      state.columns.shift();
    }
    state.columns.forEach((c,i)=>c._idx=i);
  }

  function initTooltips(){
    const els = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    els.forEach(el => {
      if (!bootstrap.Tooltip.getInstance(el)){
        new bootstrap.Tooltip(el, {trigger: "hover"});
      }
    });
  }

  async function apiGet(url){
    const res = await fetch(url, {headers: {"Accept":"application/json"}});
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}
    if (!res.ok){
      throw new Error((data && (data.detail || data.error)) ? (data.detail || data.error) : text);
    }
    return data;
  }

  async function apiPost(url, body){
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify(body)
    });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}
    if (!res.ok){
      throw new Error((data && (data.detail || data.error)) ? (data.detail || data.error) : text);
    }
    return data;
  }

  function urlNextRanks(dataset, path){
    const p = path ? encodeURIComponent(JSON.stringify(path)) : "";
    return `/api/col/next-ranks/?dataset_code=${encodeURIComponent(dataset)}${p ? `&path=${p}` : ""}`;
  }
  function urlNodes(dataset, path, rank, offset, limit){
    const p = path ? encodeURIComponent(JSON.stringify(path)) : "";
    return `/api/col/nodes/?dataset_code=${encodeURIComponent(dataset)}&rank=${encodeURIComponent(rank)}${p ? `&path=${p}` : ""}&offset=${offset}&limit=${limit}`;
  }
  function urlSpecies(dataset, path, offset, limit){
    const p = path ? encodeURIComponent(JSON.stringify(path)) : "";
    return `/api/col/species/?dataset_code=${encodeURIComponent(dataset)}${p ? `&path=${p}` : ""}&offset=${offset}&limit=${limit}`;
  }

  // Pines compactos
  function renderPins(){
    const el = $("pins");
    if (state.pins.size === 0){
      el.innerHTML = `<div class="text-muted">Sin pines.</div>`;
      return;
    }
    const rows = Array.from(state.pins.values())
      .sort((a,b)=>a.label.localeCompare(b.label))
      .map(p => {
        const k = pathKey(p.path);
        return `
          <div class="d-flex align-items-center justify-content-between gap-2">
            <div class="crumb flex-grow-1" title="${esc(p.label)}">📌 ${esc(p.label)}</div>
            <div class="d-flex gap-1 flex-shrink-0">
              <button class="btn btn-sm btn-outline-primary btn-ico" data-act="goto-pin" data-key="${esc(k)}" title="Ir">↩</button>
              <button class="btn btn-sm btn-outline-danger btn-ico" data-act="rm-pin" data-key="${esc(k)}" title="Quitar">✕</button>
            </div>
          </div>
        `;
      }).join("");
    el.innerHTML = rows;
  }

  function renderSelection(){
    const el = $("selection");
    const n = state.selected.size;
    $("selCount").textContent = `${n} seleccionadas`;
    if (n === 0){
      el.innerHTML = `<div class="text-muted">Sin selección.</div>`;
      return;
    }
    const rows = Array.from(state.selected.values())
      .sort((a,b)=>a.label.localeCompare(b.label))
      .slice(0, 200)
      .map(s => {
        const k = pathKey(s.path);
        return `
          <div class="d-flex align-items-center justify-content-between gap-2">
            <div class="crumb flex-grow-1" title="${esc(s.label)}">${esc(s.label)}</div>
            <button class="btn btn-sm btn-outline-danger btn-ico" data-act="rm-sel" data-key="${esc(k)}" title="Quitar">✕</button>
          </div>
        `;
      }).join("");
    el.innerHTML = rows + (n > 200 ? `<div class="text-muted">Mostrando 200 de ${n}.</div>` : "");
  }

  // Delegación panel lateral
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const key = btn.dataset.key;

    if (act === "rm-pin"){
      state.pins.delete(key);
      renderPins();
      return;
    }
    if (act === "goto-pin"){
      const p = state.pins.get(key);
      if (!p) return;
      buildColumnsToPath(p.path);
      return;
    }
    if (act === "rm-sel"){
      state.selected.delete(key);
      renderSelection();
      return;
    }
  });

  function renderColumns(){
    const wrap = $("columns");
    wrap.innerHTML = "";

    state.columns.forEach((col, idx) => {
      const colEl = document.createElement("div");
      colEl.className = "tax-col";

      let headerTitle = "";
      if (col.type === "ranks") headerTitle = "Siguientes ranks";
      if (col.type === "nodes") headerTitle = `Rank: ${col.rank}`;
      if (col.type === "species") headerTitle = "Especies";

      const head = document.createElement("div");
      head.className = "tax-col-header";
      head.innerHTML = `
        <div class="d-flex justify-content-between align-items-center gap-2">
          <div>
            <div class="fw-semibold">${esc(headerTitle)}</div>
            <div class="mini crumb" title="${esc(crumb(col.path))}">${esc(crumb(col.path))}</div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" data-colact="close-from" data-idx="${idx}" title="Cerrar columnas a la derecha">»</button>
        </div>
      `;

      const body = document.createElement("div");
      body.className = "tax-col-body";
      body.dataset.colidx = String(idx);

      if (col.loading){
        body.innerHTML = `<div class="text-muted">Cargando...</div>`;
      } else if (col.error){
        body.innerHTML = `<div class="text-danger small">${esc(col.error)}</div>`;
      } else {
        body.innerHTML = (col.items && col.items.length)
          ? col.items.map(item => renderItem(col, item)).join("")
          : `<div class="text-muted">Sin resultados.</div>`;

        if (col.next_offset !== null && col.next_offset !== undefined){
          body.innerHTML += `
            <div class="d-grid mt-2">
              <button class="btn btn-sm btn-outline-primary" data-colact="more" data-idx="${idx}">
                Cargar más
              </button>
            </div>
          `;
        }
      }

      colEl.appendChild(head);
      colEl.appendChild(body);
      wrap.appendChild(colEl);
    });

    initTooltips();
  }

  function renderItem(col, item){
    if (col.type === "ranks"){
      return `
        <div class="node-item" style="grid-template-columns: 1fr auto auto auto auto;">
          <div>
            <div class="node-name">${esc(item.rank)}</div>
            <div class="node-meta">${esc(item.count_species)} especies · ${esc(item.count_distinct_names)} nombres</div>
          </div>
          <span class="badge text-bg-secondary badge-count">${esc(item.count_species)}</span>
          <button class="btn btn-sm btn-outline-primary btn-ico" data-act="open-rank" data-rank="${esc(item.rank)}" data-col="${col._idx}" title="Abrir rank">→</button>
          <button class="btn btn-sm btn-outline-secondary btn-ico" disabled title="No aplica">⇢sp</button>
          <button class="btn btn-sm btn-outline-secondary btn-ico" disabled title="Pin no aplica aquí">📌</button>
        </div>
      `;
    }

    if (col.type === "nodes"){
      const nextPath = item.path_next;
      const k = pathKey(nextPath);
      const pinned = state.pins.has(k);

      const fromLabel = crumb(col.path || []);
      const nodeLabel = crumb(nextPath);
      const tip = `Desde: ${fromLabel}\nNodo: ${nodeLabel}\nAcción: saltar a species`;

      return `
        <div class="node-item">
          <div>
            <div class="node-name" title="${esc(item.name)}">${esc(item.name)}</div>
            <div class="node-meta">${esc(item.count_species)} especies · ${item.has_children ? "tiene hijos" : "terminal"}</div>
          </div>
          <span class="badge text-bg-secondary badge-count">${esc(item.count_species)}</span>

          <button class="btn btn-sm btn-outline-primary btn-ico"
                  data-act="${item.has_children ? "open-next" : "open-species"}"
                  data-path='${esc(JSON.stringify(nextPath))}'
                  title="${item.has_children ? "Abrir siguiente" : "Ver especies"}">→</button>

          <button class="btn btn-sm btn-outline-info btn-ico"
                  data-act="jump-species"
                  data-path='${esc(JSON.stringify(nextPath))}'
                  data-bs-toggle="tooltip"
                  data-bs-placement="left"
                  data-bs-title="${esc(tip)}"
                  title="Ir directo a species">⇢sp</button>

          <button class="btn btn-sm ${pinned ? "btn-secondary" : "btn-outline-secondary"} btn-ico"
                  data-act="pin"
                  data-path='${esc(JSON.stringify(nextPath))}'
                  title="${pinned ? "Ya fijado" : "Fijar rama"}">📌</button>
        </div>
      `;
    }

    if (col.type === "species"){
      const spPath = (col.path || []).concat([{rank:"species", name:item.name}]);
      const k = pathKey(spPath);
      const checked = state.selected.has(k);

      return `
        <div class="node-item" style="grid-template-columns: 1fr auto auto auto;">
          <div>
            <div class="node-name"><i>${esc(item.name)}</i></div>
            <div class="node-meta mono">${esc(item.external_id || "")}</div>
          </div>
          <span class="badge text-bg-secondary badge-count">sp</span>
          <button class="btn btn-sm ${checked ? "btn-success" : "btn-outline-success"} btn-ico"
                  data-act="toggle-sel"
                  data-path='${esc(JSON.stringify(spPath))}'
                  data-label='${esc(item.name)}'
                  title="Seleccionar">✓</button>
          <button class="btn btn-sm btn-outline-secondary btn-ico" disabled title="No aplica">📌</button>
        </div>
      `;
    }

    return "";
  }

  // Eventos columnas
  document.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("button[data-colact], button[data-act]");
    if (!btn) return;

    if (btn.dataset.colact === "close-from"){
      const idx = Number(btn.dataset.idx);
      state.columns = state.columns.slice(0, idx + 1);
      enforceMaxCols();
      renderColumns();
      return;
    }

    if (btn.dataset.colact === "more"){
      const idx = Number(btn.dataset.idx);
      await loadMore(idx);
      return;
    }

    const act = btn.dataset.act;

    if (act === "open-rank"){
      const rank = btn.dataset.rank;
      const colIdx = Number(btn.dataset.col);
      const basePath = state.columns[colIdx].path || [];
      await openNodesColumn(basePath, rank, colIdx);
      return;
    }

    if (act === "open-next"){
      const nextPath = JSON.parse(btn.dataset.path);
      await openNextRanksColumn(nextPath);
      return;
    }

    if (act === "open-species"){
      const nextPath = JSON.parse(btn.dataset.path);
      await openSpeciesColumn(nextPath);
      return;
    }

    // ⇢sp: saltar directo a species
    if (act === "jump-species"){
      const nextPath = JSON.parse(btn.dataset.path);
      await openSpeciesColumn(nextPath);
      return;
    }

    if (act === "pin"){
      const p = JSON.parse(btn.dataset.path);
      const k = pathKey(p);
      if (state.pins.has(k)) state.pins.delete(k);
      else state.pins.set(k, {path: p, label: crumb(p)});
      renderPins();
      renderColumns();
      return;
    }

    if (act === "toggle-sel"){
      const p = JSON.parse(btn.dataset.path);
      const k = pathKey(p);
      const label = btn.dataset.label || crumb(p);
      if (state.selected.has(k)) state.selected.delete(k);
      else state.selected.set(k, {path: p, label});
      renderSelection();
      renderColumns();
      return;
    }
  });

  async function start(){
    state.dataset = $("datasetCode").value.trim();
    state.pageSize = Number($("pageSize").value);
    state.columns = [];
    $("statusLine").textContent = "";
    await openNextRanksColumn([]);
  }

  async function openNextRanksColumn(path){
    const col = {type:"ranks", path, loading:true, items:[], next_offset:null};
    state.columns.push(col);
    enforceMaxCols();
    renderColumns();

    try{
      const data = await apiGet(urlNextRanks(state.dataset, path));
      col.loading = false;
      col.items = data.next_ranks || [];
      $("statusLine").textContent = `Especies accepted disponibles (scan): ${data.scanned_species}`;
    }catch(e){
      col.loading = false;
      col.error = e.message;
    }
    enforceMaxCols();
    renderColumns();
  }

  async function openNodesColumn(path, rank, fromColIdx){
    state.columns = state.columns.slice(0, fromColIdx + 1);
    const col = {type:"nodes", path, rank, loading:true, items:[], offset:0, limit:state.pageSize, next_offset:null};
    state.columns.push(col);
    enforceMaxCols();
    renderColumns();

    try{
      const data = await apiGet(urlNodes(state.dataset, path, rank, 0, state.pageSize));
      col.loading = false;
      col.items = data.items || [];
      col.total = data.total;
      col.next_offset = data.next_offset;
      $("statusLine").textContent = `Especies accepted disponibles (scan): ${data.scanned_species}`;
    }catch(e){
      col.loading = false;
      col.error = e.message;
    }
    enforceMaxCols();
    renderColumns();
  }

  async function openSpeciesColumn(path){
    const col = {type:"species", path, loading:true, items:[], offset:0, limit:state.pageSize, next_offset:null};
    state.columns.push(col);
    enforceMaxCols();
    renderColumns();

    try{
      const data = await apiGet(urlSpecies(state.dataset, path, 0, state.pageSize));
      col.loading = false;
      col.items = data.species || [];
      col.total = data.total;
      col.next_offset = data.next_offset;
      $("statusLine").textContent = `Especies accepted disponibles (scan): ${data.scanned_species}`;
    }catch(e){
      col.loading = false;
      col.error = e.message;
    }
    enforceMaxCols();
    renderColumns();
  }

  async function loadMore(colIdx){
    const col = state.columns[colIdx];
    if (!col || col.next_offset === null || col.next_offset === undefined) return;

    const next = col.next_offset;
    const limit = col.limit || state.pageSize;

    try{
      if (col.type === "nodes"){
        const data = await apiGet(urlNodes(state.dataset, col.path, col.rank, next, limit));
        col.items = col.items.concat(data.items || []);
        col.next_offset = data.next_offset;
      } else if (col.type === "species"){
        const data = await apiGet(urlSpecies(state.dataset, col.path, next, limit));
        col.items = col.items.concat(data.species || []);
        col.next_offset = data.next_offset;
      }
    }catch(e){
      col.error = e.message;
    }

    enforceMaxCols();
    renderColumns();
  }

  async function buildColumnsToPath(path){
    state.columns = [];
    await openNextRanksColumn([]);
    $("statusLine").textContent = `Pin: ${crumb(path)}`;
  }

  $("btnStart").addEventListener("click", start);

  $("btnClearPins").addEventListener("click", () => {
    state.pins.clear();
    renderPins();
    renderColumns();
  });

  $("btnClearSel").addEventListener("click", () => {
    state.selected.clear();
    renderSelection();
    renderColumns();
  });

  $("btnResolve").addEventListener("click", async () => {
    const paths = Array.from(state.selected.values()).map(x => x.path);
    if (!paths.length){
      alert("No hay selección.");
      return;
    }
    try{
      const data = await apiPost("/api/col/resolve/", {dataset_code: state.dataset, selected_paths: paths});
      alert(`Especies resueltas: ${data.species ? data.species.length : 0}`);
    }catch(e){
      alert(`Error: ${e.message}`);
    }
  });

  renderPins();
  renderSelection();
  start();
</script>
</body>
</html>
