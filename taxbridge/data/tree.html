<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Árbol (apertura por nivel + checkbox)</title>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: 100vh; }
    #left { overflow: auto; }
    #right { border-left: 1px solid rgba(0,0,0,.12); padding: 12px; overflow: auto; }

    .link { fill: none; stroke: rgba(0,0,0,.18); stroke-width: 2px; }

    .node { cursor: pointer; }
    .node rect.node-box { stroke-width: 2px; rx: 3px; ry: 3px; }
    .node text { font-size: 12px; dominant-baseline: middle; pointer-events: none; }
    .node text.sciname { font-style: italic; }
    .node.has-children-collapsed rect.node-box { stroke-dasharray: 4 3; }

    /* Checkbox */
    .cb-box { fill: #fff; stroke: rgba(0,0,0,.35); stroke-width: 1.5px; rx: 2px; ry: 2px; }
    .cb-tick { fill: none; stroke: rgba(0,0,0,.8); stroke-width: 2.2px; stroke-linecap: round; stroke-linejoin: round; }
    .cb-hit { fill: transparent; } /* área clicable */
    .cb-checked .cb-box { stroke: rgba(0,0,0,.8); }
  </style>
</head>

<body>
<div class="wrap">
  <div id="left"></div>
  <aside id="right">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <div style="font-weight:600;">Selección</div>
      <button id="clearBtn" type="button" style="border:1px solid rgba(0,0,0,.2);background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;">
        Limpiar
      </button>
    </div>
    <div style="font-size:12px;color:rgba(0,0,0,.65);margin-top:6px;">
      Marca los taxones que quieras conservar para el set final.
    </div>
    <hr style="border:none;border-top:1px solid rgba(0,0,0,.12);margin:12px 0;">
    <div id="selList" style="font-size:13px;line-height:1.35;"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/4.13.0/d3.min.js"></script>
<script>
  // =========================
  // TU EJEMPLO (sin cambios)
  // =========================
  const treeData = {
    name: "Eukaryota",
    children: [
      {
        name: "Metazoa",
        children: [
          {
            name: "Chordata",
            children: [
              { name: "Homo sapiens" },
              { name: "Mus musculus" }
            ]
          },
          {
            name: "Arthropoda",
            children: [
              { name: "Drosophila melanogaster" }
            ]
          }
        ]
      },
      {
        name: "Viridiplantae",
        children: [
          {
            name: "Angiosperms",
            children: [
              { name: "Arabidopsis thaliana" },
              { name: "Zea mays" }
            ]
          }
        ]
      },
      {
        name: "Fungi",
        children: [
          { name: "Saccharomyces cerevisiae" }
        ]
      }
    ]
  };

  // =========================
  // Config
  // =========================
  const NODE_H = 20;
  const PAD_X  = 8;
  const MAX_W  = 260;
  const MIN_W  = 34;

  const DUR = 160;

  // Checkbox
  const SHOW_CHECKBOX_ONLY_ON_LEAVES = false; // pon true si quieres solo especies/hojas
  const CB_SIZE = 12;                         // tamaño del checkbox
  const CB_GAP  = 6;                          // espacio checkbox -> texto

  const margin = { top: 18, right: 18, bottom: 18, left: 60 };
  let width  = Math.max(700, (window.innerWidth - 320) - margin.left - margin.right);
  let height = 760 - margin.top - margin.bottom;

  // Colores por nivel (mismo esquema que antes)
  const LEVEL_STYLES = [
    { fill: "#eef2ff", stroke: "#4f46e5" }, // 0
    { fill: "#ecfeff", stroke: "#0891b2" }, // 1
    { fill: "#f0fdf4", stroke: "#16a34a" }, // 2
    { fill: "#fff7ed", stroke: "#ea580c" }, // 3
    { fill: "#fdf2f8", stroke: "#db2777" }, // 4
    { fill: "#f5f3ff", stroke: "#7c3aed" }, // 5
    { fill: "#fffbeb", stroke: "#d97706" }, // 6
    { fill: "#f1f5f9", stroke: "#334155" }  // 7
  ];
  function styleForDepth(depth) {
    if (depth < 0) depth = 0;
    if (depth >= LEVEL_STYLES.length) return LEVEL_STYLES[LEVEL_STYLES.length - 1];
    return LEVEL_STYLES[depth];
  }

  function isScientificName(name) {
    const parts = (name || "").trim().split(/\s+/);
    return parts.length >= 2;
  }

  // =========================
  // Estado de selección
  // =========================
  const selectedIds = new Set(); // guarda d.id

  function updateSelectionPanel(nodesById) {
    const el = document.getElementById("selList");
    const items = Array.from(selectedIds)
      .map(id => nodesById.get(id))
      .filter(Boolean)
      .map(d => d.data.name)
      .sort((a,b)=>a.localeCompare(b));

    if (!items.length) {
      el.innerHTML = `<div style="color:rgba(0,0,0,.6);">No taxa selected.</div>`;
      return;
    }
    el.innerHTML = items.map(n => `<div>${escapeHtml(n)}</div>`).join("");
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // =========================
  // SVG
  // =========================
  const left = document.getElementById("left");

  const svgRoot = d3.select(left).append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom);

  const svg = svgRoot.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const treemap = d3.tree().size([height, width]);

  let i = 0;
  let root = d3.hierarchy(treeData, d => d.children);
  root.x0 = height / 2;
  root.y0 = 0;

  // Inicia colapsado: solo raíz visible; hijos de raíz colapsados también (apertura explícita)
  if (root.children) {
    root._children = root.children;
    root.children = null;
  }
  update(root);

  // Limpieza selección
  document.getElementById("clearBtn").addEventListener("click", () => {
    selectedIds.clear();
    update(root);
  });

  // =========================
  // Helpers
  // =========================
  function getDepth(n) {
    const kids = n.children || n._children || [];
    if (!kids.length) return 1;
    return 1 + Math.max.apply(null, kids.map(getDepth));
  }

  // Colapsa completamente un subárbol (para que al reabrir sea solo 1 nivel)
  function collapseDeep(d) {
    if (d.children) {
      d.children.forEach(collapseDeep);
      d._children = d.children;
      d.children = null;
    }
  }

  // Al expandir un nodo, queremos mostrar SOLO hijos directos,
  // pero asegurarnos que cada hijo quede colapsado (sin abrir nietos).
  function expandOneLevel(d) {
    if (!d._children) return;
    d.children = d._children;
    d._children = null;
    d.children.forEach(collapseDeep); // clave: hijos quedan cerrados internamente
  }

  function fitTextToWidth(textSel, maxWidthPx) {
    const node = textSel.node();
    const full = textSel.text();
    if (node.getComputedTextLength() <= maxWidthPx) return;

    let s = full;
    while (s.length > 1 && node.getComputedTextLength() > maxWidthPx) {
      s = s.slice(0, -1);
      textSel.text(s + "…");
    }
  }

  function diagonal(s, d) {
    return `M ${s.y} ${s.x}
            C ${(s.y + d.y) / 2} ${s.x},
              ${(s.y + d.y) / 2} ${d.x},
              ${d.y} ${d.x}`;
  }

  function shouldShowCheckbox(d) {
    if (!SHOW_CHECKBOX_ONLY_ON_LEAVES) return true;
    const isLeaf = (!d.children && !d._children);
    return isLeaf;
  }

  // =========================
  // Render
  // =========================
  function update(source) {
    width = Math.max(700, (window.innerWidth - 320) - margin.left - margin.right);
    svgRoot.attr("width", width + margin.left + margin.right);

    treemap.size([height, width]);
    const treeLayout = treemap(root);

    const nodes = treeLayout.descendants();
    const links = treeLayout.descendants().slice(1);

    const depth = getDepth(root) + 0.5;
    nodes.forEach(d => { d.y = d.depth * (width / depth); });

    // Para el panel derecho
    const nodesById = new Map(nodes.map(d => [d.id, d]));

    // ===== NODES =====
    const node = svg.selectAll("g.node")
      .data(nodes, d => d.id || (d.id = ++i));

    // ENTER
    const nodeEnter = node.enter().append("g")
      .attr("class", "node")
      .attr("transform", `translate(${source.y0},${source.x0})`)
      .style("opacity", 0);

    // Grupo checkbox (va antes del texto)
    const cbEnter = nodeEnter.append("g")
      .attr("class", "cb")
      .style("display", d => shouldShowCheckbox(d) ? null : "none")
      .on("click", function(d) {
        // Evita que también haga toggle del nodo
        d3.event.stopPropagation();
        toggleSelected(d);
        update(d);
      });

    cbEnter.append("rect")
      .attr("class", "cb-box")
      .attr("x", PAD_X)
      .attr("y", -CB_SIZE/2)
      .attr("width", CB_SIZE)
      .attr("height", CB_SIZE);

    // tick (se muestra/oculta con clase)
    cbEnter.append("path")
      .attr("class", "cb-tick")
      .attr("d", `M ${PAD_X + 2} ${-1} L ${PAD_X + 5} ${CB_SIZE/2 - 1} L ${PAD_X + CB_SIZE - 2} ${-CB_SIZE/2 + 2}`)
      .style("opacity", 0);

    // área clicable más grande
    cbEnter.append("rect")
      .attr("class", "cb-hit")
      .attr("x", PAD_X - 4)
      .attr("y", -CB_SIZE/2 - 6)
      .attr("width", CB_SIZE + 8)
      .attr("height", CB_SIZE + 12);

    // Texto (desplazado para dejar espacio al checkbox)
    const textEnter = nodeEnter.append("text")
      .attr("class", d => isScientificName(d.data.name) ? "sciname" : "")
      .attr("x", PAD_X + (shouldShowCheckboxPlaceholder() ? (CB_SIZE + CB_GAP) : 0))
      .attr("y", 0)
      .text(d => d.data.name);

    textEnter.append("title").text(d => d.data.name);

    // Rect detrás de todo (inserta antes del primer elemento)
    nodeEnter.insert("rect", ":first-child")
      .attr("class", "node-box")
      .attr("x", 0)
      .attr("y", -NODE_H / 2)
      .attr("height", NODE_H)
      .attr("width", MIN_W);

    // Ajusta ancho + truncado
    nodeEnter.each(function(d) {
      const g = d3.select(this);
      const t = g.select("text");

      // ancho disponible para texto: MAX_W menos padding y checkbox si aplica
      const leftPad = PAD_X + (shouldShowCheckbox(d) ? (CB_SIZE + CB_GAP) : 0);
      fitTextToWidth(t, MAX_W - leftPad - PAD_X);

      const bbox = t.node().getBBox();
      // bbox.x ya incluye el offset, así que usamos bbox.width + bbox.x + PAD_X
      const w = Math.max(
        MIN_W,
        Math.min(MAX_W, bbox.width + bbox.x + PAD_X)
      );
      g.select("rect.node-box").attr("width", w);
    });

    // Merge
    const nodeUpdate = nodeEnter.merge(node);

    // Colores por nivel
    nodeUpdate.each(function(d) {
      const st = styleForDepth(d.depth);
      d3.select(this).select("rect.node-box")
        .attr("fill", st.fill)
        .attr("stroke", st.stroke);
    });

    // Clase hijos colapsados
    nodeUpdate.classed("has-children-collapsed", d => !!d._children && !d.children);

    // Estado checkbox
    nodeUpdate.each(function(d) {
      const g = d3.select(this);
      const checked = selectedIds.has(d.id);
      g.select("g.cb").classed("cb-checked", checked);
      g.select("g.cb path.cb-tick").style("opacity", checked ? 1 : 0);
    });

    // Click del nodo (toggle) — solo si NO fue checkbox
    nodeUpdate.on("click", function(d) {
      // Toggle “por nivel”
      if (d.children) {
        // colapsa todo lo visible debajo para no recordar aperturas internas
        d.children.forEach(collapseDeep);
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        expandOneLevel(d); // solo abre el siguiente nivel
      }
      update(d);
    });

    // Transición sobria
    nodeUpdate.transition()
      .duration(DUR)
      .attr("transform", d => `translate(${d.y},${d.x})`)
      .style("opacity", 1);

    // EXIT: fade + scale
    node.exit()
      .transition()
      .duration(DUR)
      .style("opacity", 0)
      .attr("transform", d => `translate(${d.y},${d.x}) scale(0.96)`)
      .remove();

    // ===== LINKS =====
    const link = svg.selectAll("path.link")
      .data(links, d => d.id);

    const linkEnter = link.enter().insert("path", "g")
      .attr("class", "link")
      .attr("d", d => {
        const o = { x: d.x0 || source.x0, y: d.y0 || source.y0 };
        return diagonal(o, o);
      })
      .style("opacity", 0);

    linkEnter.merge(link)
      .transition()
      .duration(DUR)
      .style("opacity", 1)
      .attr("d", d => diagonal(d, d.parent));

    link.exit()
      .transition()
      .duration(DUR)
      .style("opacity", 0)
      .remove();

    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

    updateSelectionPanel(nodesById);
  }

  function toggleSelected(d) {
    if (selectedIds.has(d.id)) selectedIds.delete(d.id);
    else selectedIds.add(d.id);
  }

  function shouldShowCheckboxPlaceholder() {
    // Si SHOW_CHECKBOX_ONLY_ON_LEAVES = true, el placeholder varía.
    // Para simplificar alineación, reservamos espacio siempre.
    return true;
  }

  window.addEventListener("resize", () => update(root));
</script>
</body>
</html>
